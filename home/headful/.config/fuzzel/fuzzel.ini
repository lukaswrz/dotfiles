[main]
layer=overlay
show-actions=yes
launch-prefix=uwsm app --

[colors]
# Brewer color scheme by Timothée Poisot (with modifications)

background=0c0d0eff
text=959697ff
prompt=b7b8b9ff
placeholder=515253ff
input=959697ff
match=b15928ff
selection=262424ff
selection-text=b7b8b9ff
selection-match=dd5307ff
counter=515253ff
border=fcfdfeff

[key-bindings]
delete-line-forward = none
delete-prev-word = Control+w
cancel = Control+c Escape XF86Back
next = Down Control+j
prev = Up Control+k

[border]
radius = 5
