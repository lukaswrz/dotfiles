[main]
layer=overlay
show-actions=yes

[colors]
# Base16 Isotope by Jan T. Sott (with modifications)

background=000000ff
text=ffffffff
prompt=d0d0d0ff
placeholder=606060ff
input=c0c0c0ff
match=3300ffff
selection=404040f0
selection-text=ffffffff
selection-match=3300ffff
counter=606060ff
border=ffffffff

[key-bindings]
delete-line-forward = none
delete-prev-word = Control+w
cancel = Control+c Escape XF86Back
next = Down Control+j
prev = Up Control+k

[border]
radius = 5
